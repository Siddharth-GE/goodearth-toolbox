# Every push and pull request. The four static checks each run even when
# one fails, so one push shows every verdict; the build and everything
# after it wait for all four.
#
# One secret: SUPABASE_ACCESS_TOKEN, the management API key, for the two
# database checks at the end. It is account-level and reaches both
# databases; rotating it means rotating it here too.

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Before npm ci, so the source hash never walks node_modules.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Types
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Tests
        if: ${{ !cancelled() }}
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time only: every page is dynamic, so no data is fetched.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      # After the build: it reads the compiled output (BUGCATCHER #5).
      - name: Server actions
        run: npm run check:actions

      # LAST: the two read-only checks against the database the base branch
      # deploys to. A pull request into master sits red until its migration
      # is applied, and that expected red must not hide the checks above.
      # They never fix what they find: that would apply an unreviewed
      # migration from CI.
      #
      # 1. Has this database had every migration in this branch?
      # 2. Are the views still the shape they claim? Views bypass row-level
      #    security, so each one's columns, WHERE and grants are its whole
      #    boundary (scripts/view-manifest.ts pins them).
      - name: Production has every migration (PRs into master)
        if: github.base_ref == 'master'
        run: npm run db:check -- --project pajfrgnkapicdgangjey
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Staging has every migration (PRs into staging)
        if: github.base_ref == 'staging'
        run: npm run db:check -- --project ipstebqawrvhkyntctrv
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: The views are still the shape they claim (PRs into master)
        if: github.base_ref == 'master'
        run: npm run db:check-views -- --project pajfrgnkapicdgangjey
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: The views are still the shape they claim (PRs into staging)
        if: github.base_ref == 'staging'
        run: npm run db:check-views -- --project ipstebqawrvhkyntctrv
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
