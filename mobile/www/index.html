<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toolbox</title>
    <!-- Shown in place of a blank page whenever toolbox.kaadalgroup.com can't be reached (server.errorPath). -->
    <style>
      :root {
        --paper: #f4f2ee;
        --ink: #1c1a17;
        --muted: #6b665e;
        --brand: #521323;
        --on-brand: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--paper);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      h1 {
        font-size: 1.375rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        background: var(--brand);
        color: var(--on-brand);
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No connection</h1>
      <p>Toolbox needs the internet. Check your mobile data or Wi-Fi, then try again.</p>
      <a href="https://toolbox.kaadalgroup.com/">Try again</a>
    </main>
  </body>
</html>
